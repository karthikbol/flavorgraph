spring.application.name=backend

# CognoDB
cognodb.uri=${COGNODB_URI:bolt://localhost:7687}
cognodb.username=${COGNODB_USERNAME:cognodb}
cognodb.password=${COGNODB_PASSWORD:change-me}
app.frontend-url=${FRONTEND_URL:http://localhost:5173,http://127.0.0.1:5173}
app.seed-enabled=${SEED_DATABASE:false}
server.shutdown=graceful
server.port=${PORT:8080}
