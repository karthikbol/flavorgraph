services:
  - type: web
    name: flavorgraph-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: COGNODB_URI
        sync: false
      - key: COGNODB_USERNAME
        sync: false
      - key: COGNODB_PASSWORD
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: SEED_DATABASE
        value: "false"
